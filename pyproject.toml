[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statpadder-vision"
version = "0.1.0"
description = "Tracking data from ball-following football match video"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "shapely>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spv = "spv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
